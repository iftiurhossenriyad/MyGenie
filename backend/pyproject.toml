[project]
name = "mygenie-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy",
    "alembic",
    "psycopg[binary]",
    "python-jose[cryptography]",
    "passlib[bcrypt]",
    "bcrypt<4.1",
    "python-multipart",
    "pydantic-settings",
    "email-validator",
    "google-genai>=2.3,<3.0",
]

[tool.uv]
package = false

[tool.vercel.scripts]
build = "alembic upgrade head"
